name: Verify cloud security center

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'candidate/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Linux install and identity scripts
        run: bash -n scripts/install-linux.sh scripts/lib/identity-config.sh scripts/enroll-node.sh scripts/export-business-bundle.sh scripts/rotate-identity.sh tests/identity-scripts.test.sh
      - name: Test Linux identity migration, enrollment and rotation
        run: sudo bash tests/identity-scripts.test.sh
      - name: Run monitor and real mutual TLS tests
        run: node --test
