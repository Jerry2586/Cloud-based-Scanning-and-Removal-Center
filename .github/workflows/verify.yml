name: Verify cloud security center

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'candidate/**'
      - 'feat/**'
      - 'refactor/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify Go manager and build signed-payload inputs
        run: |
          (cd manager && sudo env "PATH=$PATH" go test -race -count=1 ./... && go vet ./...)
          bash scripts/build-manager.sh
          sudo env "PATH=$PATH" python3 tests/multi-engine.test.py
          sudo env "PATH=$PATH" python3 tests/engine-readiness.test.py
      - name: Validate every shell script independently
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.run' \) -not -path './.git/*' -print | sort)
      - name: Test environment preparation and bootstrap failure decisions (mocked, non-destructive)
        run: bash tests/install-environment.test.sh
      - name: Test digest-pinned image source failover without host mutation
        run: bash tests/install-image.test.sh
      - name: Test automatic public IPv4 selection without host mutation
        run: bash tests/install-public-host.test.sh
      - name: Test management lock contention and bounded waiting
        run: |
          bash tests/management-lock.test.sh
          python3 tests/management-lock.test.py
          python3 tests/menu-transcript.test.py
      - name: Check copyable Git install commands match the tested entry
        run: node scripts/render-git-install.js --check
      - name: Validate release verifier syntax
        run: node --check scripts/verify-release.js
      - name: Test Linux identity migration, enrollment and rotation
        run: sudo bash tests/identity-scripts.test.sh
      - name: Run monitor and real mutual TLS tests
        run: node --test
      - name: Test root-owned signed program delivery and snapshot boundaries
        run: sudo env "PATH=$PATH" node --test tests/release-delivery.test.js
      - name: Verify root virus database transport and activation boundaries
        run: |
          sudo env "PATH=$PATH" node --test tests/virus-db.test.js
          sudo env "PATH=$PATH" python3 tests/virus-db-cache.test.py
      - name: Test signed install, update, rollback, backup and restore
        run: sudo env "PATH=$PATH" bash tests/release-install.test.sh
      - name: Test independent root transaction recovery (simulated services)
        run: sudo env "PATH=$PATH" bash tests/independent-transactions.test.sh
      - name: Test domain transactions, routing boundaries and installation exclusion
        run: |
          sudo env "PATH=$PATH" python3 tests/domain-control.test.py
          sudo env "PATH=$PATH" python3 tests/account-control.test.py
      - name: Test authenticated independent recovery archives
        run: sudo env "PATH=$PATH" python3 tests/recovery-archive.test.py
      - name: Test signed rules, native mutual TLS pull and real hash scanning
        run: sudo env "PATH=$PATH" IRONCURTAIN_REQUIRE_LINUX_RULES_TESTS=1 python3 tests/rules.test.py
      - name: Test generic Linux host scanner
        run: |
          sudo env "PATH=$PATH" python3 tests/host-agent.test.py
          sudo env "PATH=$PATH" python3 tests/environment.test.py
          sudo env "PATH=$PATH" python3 tests/updates.test.py
      - name: Test host discovery, full file queue faults and agent restart boundaries
        run: |
          sudo env "PATH=$PATH" python3 tests/host-inventory.test.py
          sudo env "PATH=$PATH" python3 tests/fullscan.test.py
          sudo env "PATH=$PATH" python3 tests/host-agent-recovery.test.py
          sudo env "PATH=$PATH" python3 tests/host-scheduler.test.py
          sudo env "PATH=$PATH" python3 tests/host-management-lifecycle.test.py
          sudo env "PATH=$PATH" python3 tests/host-code-cache.test.py
      - name: Test pinned findings and bounded local quarantine
        run: |
          sudo env "PATH=$PATH" python3 tests/findings.test.py
          sudo env "PATH=$PATH" python3 tests/response.test.py
      - name: Test bounded AppArmor updater integration
        run: sudo bash tests/antivirus-apparmor.test.sh
      - name: Test managed antivirus metadata
        run: sudo env "PATH=$PATH" python3 tests/antivirus-metadata.test.py

  independent-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify Go manager and build signed-payload inputs
        run: |
          (cd manager && sudo env "PATH=$PATH" go test -race -count=1 ./... && go vet ./...)
          bash scripts/build-manager.sh
          sudo env "PATH=$PATH" python3 tests/multi-engine.test.py
          sudo env "PATH=$PATH" python3 tests/engine-readiness.test.py
      - name: Check disposable runner Docker prerequisites
        run: |
          sudo systemctl start docker
          docker info >/dev/null
          docker compose version
          docker buildx version
      - name: Actual mirror pull and build after injected official registry timeout
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true IRONCURTAIN_ACCEPT_DISPOSABLE_RUNNER=1 bash tests/install-image-mirror.test.sh
      - name: Real independent local and cloud Docker installation and upgrade
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" IRONCURTAIN_ACCEPT_DISPOSABLE_RUNNER=1 bash tests/independent-deployment.test.sh 2>&1 | tee "$RUNNER_TEMP/independent-deployment.log"
      - name: Diagnose independent services and HTTPS gateway failure
        if: failure()
        run: |
          for role in local cloud; do
            sudo systemctl status "ironcurtain-domain-$role-gateway.socket" "ironcurtain-domain-$role-gateway.service" "ironcurtain-domain-$role-control.service" --no-pager || true
            sudo journalctl -u "ironcurtain-domain-$role-gateway.service" -u "ironcurtain-domain-$role-control.service" --no-pager -n 40 || true
          done
          sudo systemctl status ironcurtain-panel-check.service ironcurtain-panel-update.service --no-pager || true
          sudo journalctl -u ironcurtain-panel-check.service -u ironcurtain-panel-update.service --no-pager -n 40 || true
          sudo systemctl status ironcurtain-agent.service --no-pager || true
          sudo journalctl -u ironcurtain-agent.service --no-pager -n 30 || true
          sudo systemctl status ironcurtain-rules-sync.service ironcurtain-rules-sync.timer --no-pager || true
          sudo journalctl -u ironcurtain-rules-sync.service --no-pager -n 30 || true
          sudo stat -c '%a %u %g %F %n' /run/ironcurtain /run/ironcurtain/scan.sock || true
          sudo docker exec ironcurtain-local node --input-type=module -e 'import {localSecurityScan} from "./src/local/scan-client.js"; const s=await localSecurityScan("status"); console.log(JSON.stringify({state:s.state,reason:s.reason,progress:s.progress,protection:s.protection,full_scan:s.full_scan}));' || true
          for container in ironcurtain-local ironcurtain-cloud; do
            sudo docker inspect --format '{{json .State.Health}}' "$container" || true
            sudo docker inspect --format 'running={{.State.Running}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' "$container" || true
            sudo docker exec "$container" node src/healthcheck.js || true
          done
          tail -n 45 "$RUNNER_TEMP/independent-deployment.log" || true

  antivirus-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Real ClamAV package provisioning and deterministic engine acceptance
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true bash tests/antivirus-engine.test.sh

  candidate-sign:
    if: startsWith(github.ref, 'refs/heads/candidate/')
    needs: [verify, independent-deployment, antivirus-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify Go manager and build signed-payload inputs
        run: |
          (cd manager && sudo env "PATH=$PATH" go test -race -count=1 ./... && go vet ./...)
          bash scripts/build-manager.sh
          sudo env "PATH=$PATH" python3 tests/multi-engine.test.py
          sudo env "PATH=$PATH" python3 tests/engine-readiness.test.py
      - name: Sign and verify candidate without publishing
        env:
          SIGNING_KEY: ${{ secrets.APPGOG_SECURITY_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SIGNING_KEY" ]]
          key="$RUNNER_TEMP/ironcurtain-candidate-private.pem"
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          bash scripts/package-release.sh --signing-key "$key" --output-dir dist
          node scripts/verify-release.js --dir dist --public-key release-public.pem --version "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-signed-candidate
          path: dist/*
          retention-days: 7
