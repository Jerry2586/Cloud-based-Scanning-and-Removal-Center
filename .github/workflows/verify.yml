name: Verify cloud security center

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'candidate/**'
      - 'feat/**'
      - 'refactor/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate every shell script independently
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.run' \) -not -path './.git/*' -print | sort)
      - name: Validate release verifier syntax
        run: node --check scripts/verify-release.js
      - name: Test Linux identity migration, enrollment and rotation
        run: sudo bash tests/identity-scripts.test.sh
      - name: Run monitor and real mutual TLS tests
        run: node --test
      - name: Test signed install, update, rollback, backup and restore
        run: sudo env "PATH=$PATH" bash tests/release-install.test.sh
      - name: Test independent root transaction recovery (simulated services)
        run: sudo env "PATH=$PATH" bash tests/independent-transactions.test.sh
      - name: Test generic Linux host scanner
        run: sudo env "PATH=$PATH" python3 tests/host-agent.test.py
      - name: Test managed antivirus metadata
        run: sudo env "PATH=$PATH" python3 tests/antivirus-metadata.test.py

  independent-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check disposable runner Docker prerequisites
        run: |
          sudo systemctl start docker
          docker info >/dev/null
          docker compose version
          docker buildx version
      - name: Real independent local and cloud Docker installation and upgrade
        run: sudo env "PATH=$PATH" IRONCURTAIN_ACCEPT_DISPOSABLE_RUNNER=1 bash tests/independent-deployment.test.sh
      - name: Diagnose independent scanner failure
        if: failure()
        run: |
          sudo systemctl status ironcurtain-agent.service --no-pager || true
          sudo journalctl -u ironcurtain-agent.service --no-pager -n 30 || true
          sudo stat -c '%a %u %g %F %n' /run/ironcurtain /run/ironcurtain/scan.sock || true
          sudo docker exec ironcurtain-local node --input-type=module -e 'import {localSecurityScan} from "./src/local/scan-client.js"; console.log(JSON.stringify(await localSecurityScan("status")));' || true

  antivirus-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Real ClamAV package provisioning and deterministic engine acceptance
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true bash tests/antivirus-engine.test.sh
