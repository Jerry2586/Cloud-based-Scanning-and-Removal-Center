name: Verify cloud security center

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'candidate/**'
      - 'feat/**'
      - 'refactor/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate every shell script independently
        run: |
          while IFS= read -r file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.run' \) -not -path './.git/*' -print | sort)
      - name: Validate release verifier syntax
        run: node --check scripts/verify-release.js
      - name: Test Linux identity migration, enrollment and rotation
        run: sudo bash tests/identity-scripts.test.sh
      - name: Run monitor and real mutual TLS tests
        run: node --test
      - name: Test signed install, update, rollback, backup and restore
        run: sudo env "PATH=$PATH" bash tests/release-install.test.sh
      - name: Test independent root transaction recovery (simulated services)
        run: sudo env "PATH=$PATH" bash tests/independent-transactions.test.sh
      - name: Test authenticated independent recovery archives
        run: sudo env "PATH=$PATH" python3 tests/recovery-archive.test.py
      - name: Test signed rules, native mutual TLS pull and real hash scanning
        run: sudo env "PATH=$PATH" IRONCURTAIN_REQUIRE_LINUX_RULES_TESTS=1 python3 tests/rules.test.py
      - name: Test generic Linux host scanner
        run: sudo env "PATH=$PATH" python3 tests/host-agent.test.py
      - name: Test pinned findings and bounded local quarantine
        run: |
          sudo env "PATH=$PATH" python3 tests/findings.test.py
          sudo env "PATH=$PATH" python3 tests/response.test.py
      - name: Test managed antivirus metadata
        run: sudo env "PATH=$PATH" python3 tests/antivirus-metadata.test.py

  independent-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check disposable runner Docker prerequisites
        run: |
          sudo systemctl start docker
          docker info >/dev/null
          docker compose version
          docker buildx version
      - name: Real independent local and cloud Docker installation and upgrade
        run: sudo env "PATH=$PATH" IRONCURTAIN_ACCEPT_DISPOSABLE_RUNNER=1 bash tests/independent-deployment.test.sh
      - name: Diagnose independent scanner failure
        if: failure()
        run: |
          sudo systemctl status ironcurtain-agent.service --no-pager || true
          sudo journalctl -u ironcurtain-agent.service --no-pager -n 30 || true
          sudo systemctl status ironcurtain-rules-sync.service ironcurtain-rules-sync.timer --no-pager || true
          sudo journalctl -u ironcurtain-rules-sync.service --no-pager -n 30 || true
          sudo stat -c '%a %u %g %F %n' /run/ironcurtain /run/ironcurtain/scan.sock || true
          sudo docker exec ironcurtain-local node --input-type=module -e 'import {localSecurityScan} from "./src/local/scan-client.js"; console.log(JSON.stringify(await localSecurityScan("status")));' || true

  antivirus-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Real ClamAV package provisioning and deterministic engine acceptance
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true bash tests/antivirus-engine.test.sh

  candidate-sign:
    if: startsWith(github.ref, 'refs/heads/candidate/')
    needs: [verify, independent-deployment, antivirus-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sign and verify candidate without publishing
        env:
          SIGNING_KEY: ${{ secrets.APPGOG_SECURITY_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SIGNING_KEY" ]]
          key="$RUNNER_TEMP/ironcurtain-candidate-private.pem"
          trap 'rm -f -- "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          bash scripts/package-release.sh --signing-key "$key" --output-dir dist
          node scripts/verify-release.js --dir dist --public-key release-public.pem --version "$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-signed-candidate
          path: dist/*
          retention-days: 7
